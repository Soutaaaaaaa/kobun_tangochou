# supabase/migrations/ に SQL が追加されたら、Supabase に自動で実行する。
# 必要な GitHub Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD（パスワードは環境変数から自動で読まれる）
name: Supabase の SQL を実行

on:
  push:
    branches: [main, claude/intelligent-archimedes-j95253]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

# 同時に2つ走らないようにする
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: aexvedlsvrypzttuzmvn
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: プロジェクトにつなぐ
        run: supabase link --project-ref "$PROJECT_REF"

      # 0001〜0005 は手で実行済みなので「実行済み」として記録する（何度やっても同じ結果になる）。
      # 0006 以降はここに入れない（まだ実行していなければ、次の db push で実行される）。
      - name: 手で実行済みの SQL を記録
        run: supabase migration repair --status applied 0001 0002 0003 0004 0005 --remote --yes

      - name: まだ実行していない SQL を一覧
        run: supabase migration list --remote

      - name: まだ実行していない SQL を実行
        run: supabase db push --remote --yes
