<title>古文単語400</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
/* Layout: one-column study app — header bar, then a single view (home / section / cards / quiz) at a time, max 640px wide */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #1a2132;
  --muted: #5d667c;
  --line: #d8dde8;
  --ai: #264579;        /* 藍: primary */
  --ai-soft: #e3e9f4;
  --shu: #c4412d;       /* 朱: まだ・不正解 */
  --shu-soft: #f8e4df;
  --wakatake: #2f7a4a;  /* 若竹: 覚えた・正解 */
  --wakatake-soft: #e0f0e5;
  --c1: #264579; --c2: #6a4a8c; --c3: #94661a; --c4: #2c706b;
  --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.08);
  --f-word: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --surface: #1a1f29; --surface-2: #151a22; --ink: #e5e8ef; --muted: #98a1b4; --line: #2b3240;
    --ai: #86a5dc; --ai-soft: #222c3e; --shu: #ec7a65; --shu-soft: #3a2320; --wakatake: #79bf8f; --wakatake-soft: #1d3326;
    --c1: #86a5dc; --c2: #b398d6; --c3: #d6aa5c; --c4: #6cc0b8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #1a1f29; --surface-2: #151a22; --ink: #e5e8ef; --muted: #98a1b4; --line: #2b3240;
  --ai: #86a5dc; --ai-soft: #222c3e; --shu: #ec7a65; --shu-soft: #3a2320; --wakatake: #79bf8f; --wakatake-soft: #1d3326;
  --c1: #86a5dc; --c2: #b398d6; --c3: #d6aa5c; --c4: #6cc0b8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 640px; margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 8px; }
.bar h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { border: 0; background: none; padding: 6px 8px 6px 0; font-size: 15px; color: var(--ai); display: flex; align-items: center; gap: 2px; }
.back svg { width: 18px; height: 18px; }

main {
  max-width: 640px; margin: 0 auto; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.view { display: flex; flex-direction: column; gap: 16px; }

/* home */
.summary { background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.summary-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big-num { font-family: var(--f-word); font-size: 34px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.big-num small { font-family: var(--f-body); font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--wakatake); border-radius: 99px; transition: width .3s; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }

.cat { display: grid; gap: 8px; }
.cat-head { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 0; }
.cat-head h2 { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cat-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--cc); }
.cat-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sec-list { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.sec {
  width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; display: grid;
  grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; border-top: 1px solid var(--line);
}
.sec:first-child { border-top: 0; }
.sec:hover { background: var(--surface-2); }
.sec-no { font-family: var(--f-word); font-weight: 900; font-size: 20px; color: var(--cc); width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.sec-body { min-width: 0; display: grid; gap: 5px; }
.sec-title { font-weight: 700; font-size: 14px; }
.sec-title small { color: var(--muted); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
.sec-preview { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec .meter { height: 5px; }
.sec-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.sec-count b { color: var(--ink); font-size: 15px; }

/* section */
.sec-hero { background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--cc); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc); }
.toggles { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--ai); width: 16px; height: 16px; }
.wlist { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.wrow { display: grid; grid-template-columns: 3.2ch 1fr auto; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: start; }
.wrow:first-child { border-top: 0; }
.wrow .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 4px; }
.wrow .w { min-width: 0; }
.wrow .w b { font-family: var(--f-word); font-size: 17px; font-weight: 900; }
.wrow .w small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.wrow .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; border: 1.5px solid var(--line); }
.dot.ok { background: var(--wakatake); border-color: var(--wakatake); }
.dot.ng { background: var(--shu); border-color: var(--shu); }

/* cards */
.deck-top { display: grid; gap: 8px; }
.deck-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-stats .ok { color: var(--wakatake); font-weight: 700; }
.deck-stats .ng { color: var(--shu); font-weight: 700; }
.stage { position: relative; height: min(56vh, 440px); min-height: 330px; perspective: 1200px; }
.card { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
.card.under { transform: scale(.95) translateY(10px); opacity: .7; pointer-events: none; }
.card-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.2,1); }
.card.flipped .card-in { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface);
  border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; overflow: hidden;
}
.face::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--cc); }
.back-face { transform: rotateY(180deg); }
.face-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.front-word { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.front-word b { font-family: var(--f-word); font-weight: 900; font-size: clamp(34px, 11vw, 52px); line-height: 1.2; letter-spacing: .04em; overflow-wrap: anywhere; }
.front-word .kanji { color: var(--muted); font-size: 15px; }
.pos { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.hint { text-align: center; font-size: 12px; color: var(--muted); }
.back-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.back-head b { font-family: var(--f-word); font-weight: 900; font-size: 24px; }
.back-head small { color: var(--muted); font-size: 13px; }
.means { list-style: none; margin: 12px 0 0; padding: 0; display: grid; align-content: start; gap: 10px; overflow-y: auto; flex: 1; }
.means li { display: grid; grid-template-columns: 1.4em 1fr; gap: 4px; font-size: 16px; line-height: 1.55; color: var(--shu); font-weight: 500; }
.means li span:first-child { color: var(--shu); }
.tag { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 4px; margin-right: 4px; border: 1px solid currentColor; border-radius: 3px; vertical-align: 2px; font-weight: 700; }
.note { color: var(--muted); font-weight: 400; }
.stamp {
  position: absolute; top: 22px; padding: 4px 12px; border: 3px solid; border-radius: 8px; font-weight: 700; font-size: 20px;
  opacity: 0; pointer-events: none; z-index: 2; background: var(--surface);
}
.stamp.ok { left: 18px; color: var(--wakatake); transform: rotate(-10deg); }
.stamp.ng { right: 18px; color: var(--shu); transform: rotate(10deg); }
.deck-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn.ok { color: var(--wakatake); border-color: var(--wakatake); }
.btn.ng { color: var(--shu); border-color: var(--shu); }

/* quiz */
.qcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 6px; text-align: center; }
.qcard .label { font-size: 12px; color: var(--muted); }
.qword { font-family: var(--f-word); font-weight: 900; font-size: clamp(30px, 9vw, 42px); line-height: 1.25; }
.qmean { font-size: 17px; font-weight: 700; color: var(--shu); line-height: 1.6; }
.choices { display: grid; gap: 8px; }
.choice {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left;
  display: grid; grid-template-columns: 1.6em 1fr; gap: 8px; align-items: start; min-height: 52px;
}
.choice .k { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.choice .t { font-size: 15px; line-height: 1.5; }
.choice .t.word { font-family: var(--f-word); font-weight: 900; font-size: 20px; }
.choice .reveal { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--f-body); font-weight: 400; }
.choice .reveal b { font-family: var(--f-word); font-size: 14px; color: var(--ink); }
.choice.correct { border-color: var(--wakatake); background: var(--wakatake-soft); }
.choice.wrong { border-color: var(--shu); background: var(--shu-soft); }
.choice:disabled { cursor: default; color: var(--ink); }
.feedback { font-weight: 700; text-align: center; min-height: 1.6em; }
.feedback.ok { color: var(--wakatake); }
.feedback.ng { color: var(--shu); }
.setup { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 14px; }
.setup h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); font-weight: 700; }

/* result */
.result { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 16px; text-align: center; display: grid; gap: 6px; }
.result .score { font-family: var(--f-word); font-weight: 900; font-size: 48px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.result .score small { font-size: 20px; color: var(--muted); }
.result p { margin: 0; color: var(--muted); font-size: 14px; }
.section-label { font-size: 13px; color: var(--muted); margin: 4px 2px -6px; }
.empty { text-align: center; color: var(--muted); padding: 24px; background: var(--surface); border-radius: 14px; }

@media (prefers-reduced-motion: reduce) { .card-in, .meter > i { transition: none; } }
</style>

<header class="bar"><div class="bar-in">
  <button class="back" id="backBtn" hidden aria-label="戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>戻る</button>
  <h1 id="barTitle">古文単語400</h1>
</div></header>
<main id="app"></main>

<script>
const RAW = `/*__DATA__*/`;

/* ---------- data ---------- */
const WORDS = RAW.trim().split("\n").map(line => {
  const [n, word, kanji, pos, m] = line.split("|");
  return { n: +n, word, kanji, pos, means: m.split(";") };
});
const BYNUM = new Map(WORDS.map(w => [w.n, w]));
const CATS = [
  { id: 1, name: "最頻出語", from: 1, to: 100, color: "var(--c1)" },
  { id: 2, name: "頻出語", from: 101, to: 240, color: "var(--c2)" },
  { id: 3, name: "敬語", from: 241, to: 275, color: "var(--c3)" },
  { id: 4, name: "重要語", from: 276, to: 400, color: "var(--c4)" },
];
/* about 20 words per section; a short remainder is folded into the category's last section so no section crosses categories */
const SECTIONS = [];
for (const c of CATS) {
  const total = c.to - c.from + 1;
  const k = Math.floor(total / 20), r = total - k * 20;
  const sizes = Array(k).fill(20);
  if (r >= 10) sizes.push(r); else if (r > 0) sizes[sizes.length - 1] += r;
  let start = c.from;
  for (const s of sizes) {
    SECTIONS.push({ id: SECTIONS.length + 1, cat: c, from: start, to: start + s - 1 });
    start += s;
  }
}
const sectionWords = s => WORDS.filter(w => w.n >= s.from && w.n <= s.to);
const catOf = n => CATS.find(c => n >= c.from && n <= c.to);

/* ---------- progress (per-viewer, browser storage) ---------- */
const KEY = "kobun400-progress-v1";
let PROG = {};
try { PROG = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { PROG = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(PROG)); } catch (e) {} };
const mark = (n, ok) => {
  const p = PROG[n] || { s: null, c: 0, w: 0 };
  p.s = ok ? 1 : 0; ok ? p.c++ : p.w++;
  PROG[n] = p; save();
};
const status = n => (PROG[n] ? PROG[n].s : null);
const knownCount = list => list.filter(w => status(w.n) === 1).length;
let PREFS = { shuffle: false, onlyWeak: false };
try { Object.assign(PREFS, JSON.parse(localStorage.getItem(KEY + "-prefs")) || {}); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(KEY + "-prefs", JSON.stringify(PREFS)); } catch (e) {} };

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CIRC = "①②③④⑤⑥⑦⑧";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function fmtMean(m) {
  let h = esc(m).replace(/^\[([^\]]+)\]/, '<span class="tag">$1</span>');
  h = h.replace(/《([^》]+)》/g, '<span class="note">《$1》</span>');
  return h;
}
const plainMean = m => m.replace(/^\[[^\]]+\]/, "").replace(/《[^》]+》/g, "");
const shortMean = w => w.means.slice(0, 2).map(fmtMean).join('<span class="note">／</span>');
const meanTokens = w => {
  const set = new Set();
  w.means.forEach(m => plainMean(m).replace(/（[^）]*）/g, "").split(/[・、,（）「」]/).forEach(t => {
    t = t.trim().replace(/^〜/, ""); if (t.length >= 2) set.add(t);
  }));
  return set;
};
const TOK = new Map(WORDS.map(w => [w.n, meanTokens(w)]));
const conflicts = (a, b) => { const A = TOK.get(a.n); for (const t of TOK.get(b.n)) if (A.has(t)) return true; return false; };

/* ---------- confusable distractors ---------- */
const GROUPS = [
  ["ありがたし","かたし","かたじけなし"],["めでたし","めづらし","めざまし","めやすし"],["あはれなり","をかし","いみじ","ゆゆし"],
  ["いとほし","うつくし","らうたし","かなし"],["おぼつかなし","こころもとなし","うしろめたし","うしろやすし"],["ゆかし","なつかし","こころにくし"],
  ["すさまじ","さうざうし","あいなし"],["あいなし","あぢきなし","あやなし","よしなし"],["わびし","わりなし","つらし","こころぐるし"],
  ["やさし","やすし","こころやすし"],["はしたなし","はかなし","かたはらいたし"],["ねたし","にくし","こころづきなし","めざまし"],
  ["つれづれなり","つれなし"],["いたし","いみじ","あさまし"],["やがて","やうやう","やをら"],["なかなか","なほ","なのめなり"],
  ["おぼろけなり","なのめなり","なほざりなり"],["おほす","おぼす","おもほす","おぼしめす"],["まかる","まかづ","まうづ","まゐる"],
  ["きこゆ","きこしめす","きこえさす"],["たまふ","たまはる","たまはす","たぶ"],["たてまつる","まゐらす","つかうまつる"],
  ["さぶらふ","はべり","おはす","おはします","います"],["あやし","あさまし","あやにくなり"],["としごろ","ひごろ"],
  ["あした","つとめて","つごもり"],["うつつ","うつろふ","うつくし"],["こころう","うし","こころあり","こころなし"],
  ["おどろく","おどろおどろし"],["やむごとなし","ことごとし","こよなし"],["ののしる","なんず"],["すずろなり","すさぶ","すさまじ"],
  ["あからさまなり","あらはなり"],["ことわり","ことわる"],["ゆゑ","よし","やう"],["かしこ","かしこし","かしこまる"],
  ["あながちなり","せちなり"],["しるし"],["おとなし","おとど","おと"],["いとま","ひま"],["かたち","かげ","さま"],
  ["ながむ","まもる","みる"],["おこたる","なやむ","いたはる"],["あそび","すさぶ"],["かづく","かつく"],["ふみ","ことば","こと"],
  ["いはけなし","おほけなし","いとほし"],["らうたし","うるはし","なまめかし"],["かしづく","いたはる"],["ほい","ほいなし","ほだし"],
];
const keysOf = w => w.word.split("・");
const GROUPMAP = new Map();
GROUPS.forEach((g, i) => g.forEach(k => { if (!GROUPMAP.has(k)) GROUPMAP.set(k, new Set()); GROUPMAP.get(k).add(i); }));
const groupsOf = w => { const s = new Set(); keysOf(w).forEach(k => (GROUPMAP.get(k) || []).forEach(i => s.add(i))); return s; };
const posBase = p => p.replace(/[・／].*$/, "").replace(/^(動|形動|形|副|名|連語|連体|接|代名).*$/, "$1");
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function distractors(t, mode) {
  const tg = groupsOf(t), tk = keysOf(t)[0];
  const scored = [];
  for (const c of WORDS) {
    if (c.n === t.n || conflicts(t, c)) continue;
    if (mode === "m2w" && keysOf(c).some(k => keysOf(t).includes(k))) continue; // 同じ見た目の選択肢は出さない
    const ck = keysOf(c)[0];
    let s = Math.random() * 2;
    for (const g of groupsOf(c)) if (tg.has(g)) s += 7;
    if (posBase(c.pos) === posBase(t.pos)) s += 2;
    const L = lev(tk, ck);
    if (L <= 1) s += 5; else if (L <= 2) s += 3; else if (L <= 3) s += 1;
    let p = 0; while (p < tk.length && p < ck.length && tk[p] === ck[p]) p++;
    if (p >= 2) s += 2 + (p - 2);
    if (tk.slice(-2) === ck.slice(-2)) s += 1;
    if (catOf(c.n) === catOf(t.n)) s += .5;
    scored.push([s, c]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  const pool = scored.slice(0, 7).map(x => x[1]);
  const out = [];
  for (const c of shuffle(pool)) { if (out.every(o => !conflicts(o, c))) out.push(c); if (out.length === 3) break; }
  for (const [, c] of scored) { if (out.length === 3) break; if (!out.includes(c) && out.every(o => !conflicts(o, c))) out.push(c); }
  return out;
}

/* ---------- navigation ---------- */
const stack = [];
const backBtn = document.getElementById("backBtn"), barTitle = document.getElementById("barTitle");
function go(fn, push = true) {
  if (push && current) stack.push(current);
  current = fn; fn(); window.scrollTo(0, 0);
  backBtn.hidden = stack.length === 0;
}
let current = null;
backBtn.onclick = () => { const prev = stack.pop(); if (prev) go(prev, false); };
function goHome() { stack.length = 0; go(home, false); }

/* ---------- home ---------- */
function home() {
  barTitle.textContent = "古文単語400";
  const known = knownCount(WORDS);
  const weak = WORDS.filter(w => status(w.n) === 0).length;
  let h = `<div class="view">
  <section class="summary">
    <div class="summary-top"><div class="big-num">${known}<small>/ 400 語 覚えた</small></div>
    <span style="color:var(--muted);font-size:13px">まだ ${weak} 語</span></div>
    <div class="meter"><i style="width:${known / 4}%"></i></div>
    <div class="actions">
      <button class="btn primary" id="allQuiz">総合クイズ</button>
      <button class="btn" id="weakCards" ${weak ? "" : "disabled"}>苦手をカードで</button>
    </div>
  </section>`;
  for (const c of CATS) {
    const secs = SECTIONS.filter(s => s.cat === c);
    const cw = WORDS.filter(w => w.n >= c.from && w.n <= c.to);
    h += `<section class="cat" style="--cc:${c.color}">
      <div class="cat-head"><h2>${c.name}</h2><span>No.${c.from}–${c.to}　${knownCount(cw)}/${cw.length}</span></div>
      <div class="sec-list">`;
    for (const s of secs) {
      const ws = sectionWords(s), k = knownCount(ws);
      h += `<button class="sec" data-sec="${s.id}">
        <span class="sec-no">${s.id}</span>
        <span class="sec-body"><span class="sec-title">セクション ${s.id}<small>No.${s.from}–${s.to}・${ws.length}語</small></span>
        <span class="sec-preview">${ws.slice(0, 6).map(w => esc(w.word)).join("・")}…</span>
        <span class="meter"><i style="width:${k / ws.length * 100}%"></i></span></span>
        <span class="sec-count"><b>${k}</b>/${ws.length}</span>
      </button>`;
    }
    h += `</div></section>`;
  }
  h += `</div>`;
  $app.innerHTML = h;
  $app.querySelectorAll(".sec").forEach(b => b.onclick = () => go(() => sectionView(SECTIONS[b.dataset.sec - 1])));
  document.getElementById("allQuiz").onclick = () => go(() => quizSetup(null));
  document.getElementById("weakCards").onclick = () => {
    const ws = WORDS.filter(w => status(w.n) === 0);
    go(() => cards(ws, "苦手な単語", null));
  };
}

/* ---------- section ---------- */
function sectionView(s) {
  const ws = sectionWords(s);
  barTitle.textContent = `セクション ${s.id}`;
  const k = knownCount(ws), weak = ws.filter(w => status(w.n) !== 1).length;
  $app.innerHTML = `<div class="view" style="--cc:${s.cat.color}">
    <section class="sec-hero">
      <span class="chip">${s.cat.name}　No.${s.from}–${s.to}</span>
      <div class="summary-top"><div class="big-num">${k}<small>/ ${ws.length} 語 覚えた</small></div></div>
      <div class="meter"><i style="width:${k / ws.length * 100}%"></i></div>
      <div class="actions">
        <button class="btn primary" id="toCards">単語カード</button>
        <button class="btn" id="toQuiz">四択クイズ</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="optShuffle" ${PREFS.shuffle ? "checked" : ""}>シャッフル</label>
        <label><input type="checkbox" id="optWeak" ${PREFS.onlyWeak ? "checked" : ""}>覚えていない語だけ（${weak}語）</label>
      </div>
    </section>
    <div class="wlist">${ws.map(w => `<div class="wrow">
      <span class="n">${w.n}</span>
      <div class="w"><b>${esc(w.word)}</b><small>${w.kanji ? "（" + esc(w.kanji) + "）" : ""}${esc(w.pos)}</small>
      <div class="m">${w.means.map((m, i) => (w.means.length > 1 ? CIRC[i] : "") + fmtMean(m)).join("　")}</div></div>
      <span class="dot ${status(w.n) === 1 ? "ok" : status(w.n) === 0 ? "ng" : ""}" title="${status(w.n) === 1 ? "覚えた" : status(w.n) === 0 ? "まだ" : "未学習"}"></span>
    </div>`).join("")}</div>
  </div>`;
  document.getElementById("optShuffle").onchange = e => { PREFS.shuffle = e.target.checked; savePrefs(); };
  document.getElementById("optWeak").onchange = e => { PREFS.onlyWeak = e.target.checked; savePrefs(); };
  document.getElementById("toCards").onclick = () => {
    let list = PREFS.onlyWeak ? ws.filter(w => status(w.n) !== 1) : ws;
    if (!list.length) list = ws;
    go(() => cards(list, `セクション ${s.id}`, s));
  };
  document.getElementById("toQuiz").onclick = () => go(() => quizSetup(s));
}

/* ---------- flash cards ---------- */
function cards(list, title, sec) {
  barTitle.textContent = title + "：カード";
  let deck = PREFS.shuffle ? shuffle(list) : list.slice();
  let i = 0, ok = [], ng = [];
  $app.innerHTML = `<div class="view">
    <div class="deck-top">
      <div class="deck-stats"><span id="dPos"></span><span><span class="ok" id="dOk">覚えた 0</span>　<span class="ng" id="dNg">まだ 0</span></span></div>
      <div class="meter"><i id="dBar" style="width:0%;background:var(--ai)"></i></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="hint" id="hint"></div>
    <div class="deck-btns">
      <button class="btn ok" id="bOk">← 覚えた</button>
      <button class="btn" id="bFlip">めくる</button>
      <button class="btn ng" id="bNg">まだ →</button>
    </div>
  </div>`;
  const stage = document.getElementById("stage"), hint = document.getElementById("hint");
  let card = null, flipped = false, busy = false;

  function cardHTML(w, under) {
    const c = catOf(w.n);
    return `<div class="card${under ? " under" : ""}" style="--cc:${c.color}">
      <div class="stamp ok">覚えた</div><div class="stamp ng">まだ</div>
      <div class="card-in">
        <div class="face front-face">
          <div class="face-meta"><span>${c.name}</span><span>No.${w.n}</span></div>
          <div class="front-word"><b>${esc(w.word)}</b>
            ${w.kanji ? `<span class="kanji">${esc(w.kanji)}</span>` : ""}<span class="pos">${esc(w.pos)}</span></div>
        </div>
        <div class="face back-face">
          <div class="back-head"><b>${esc(w.word)}</b><small>${w.kanji ? esc(w.kanji) + "　" : ""}${esc(w.pos)}</small></div>
          <ol class="means">${w.means.map((m, k) => `<li><span>${w.means.length > 1 ? CIRC[k] : "・"}</span><span>${fmtMean(m)}</span></li>`).join("")}</ol>
        </div>
      </div>
    </div>`;
  }
  function render() {
    document.getElementById("dPos").textContent = `${Math.min(i + 1, deck.length)} / ${deck.length}`;
    document.getElementById("dOk").textContent = `覚えた ${ok.length}`;
    document.getElementById("dNg").textContent = `まだ ${ng.length}`;
    document.getElementById("dBar").style.width = (i / deck.length * 100) + "%";
    if (i >= deck.length) return finish();
    stage.innerHTML = (deck[i + 1] ? cardHTML(deck[i + 1], true) : "") + cardHTML(deck[i], false);
    card = stage.lastElementChild; flipped = false; busy = false;
    updateHint(); bind(card);
  }
  function updateHint() {
    hint.textContent = flipped ? "← 合っていたら左へ　／　間違えたら右へ →" : "フリック（またはタップ）でめくる";
    document.getElementById("bOk").disabled = !flipped;
    document.getElementById("bNg").disabled = !flipped;
  }
  function flip() { if (busy) return; flipped = !flipped; card.classList.toggle("flipped", flipped); updateHint(); }
  function commit(isOk) {
    if (busy || !flipped) return; busy = true;
    const w = deck[i]; mark(w.n, isOk); (isOk ? ok : ng).push(w);
    const dir = isOk ? -1 : 1;
    card.style.transition = "transform .3s ease-in, opacity .3s";
    card.style.transform = `translateX(${dir * 140}%) rotate(${dir * 18}deg)`;
    card.style.opacity = "0";
    card.querySelector(".stamp." + (isOk ? "ok" : "ng")).style.opacity = 1;
    setTimeout(() => { i++; render(); }, 260);
  }
  function bind(el) {
    let sx = 0, sy = 0, dx = 0, t0 = 0, active = false;
    const stOk = el.querySelector(".stamp.ok"), stNg = el.querySelector(".stamp.ng");
    el.addEventListener("pointerdown", e => {
      if (busy) return; active = true; sx = e.clientX; sy = e.clientY; dx = 0; t0 = Date.now();
      el.setPointerCapture(e.pointerId); el.style.transition = "none";
    });
    el.addEventListener("pointermove", e => {
      if (!active) return; dx = e.clientX - sx;
      el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      if (flipped) { stOk.style.opacity = Math.max(0, Math.min(1, -dx / 90)); stNg.style.opacity = Math.max(0, Math.min(1, dx / 90)); }
    });
    const end = e => {
      if (!active) return; active = false;
      const dt = Date.now() - t0, moved = Math.abs(dx), fast = moved > 30 && moved / dt > .5;
      el.style.transition = "transform .25s ease-out"; stOk.style.opacity = 0; stNg.style.opacity = 0;
      if (moved > 80 || fast) {
        if (!flipped) { el.style.transform = ""; flip(); }
        else commit(dx < 0);
      } else {
        el.style.transform = "";
        if (moved < 8 && dt < 400 && e.type === "pointerup") flip();
      }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }
  function finish() {
    keyOff();
    const total = ok.length + ng.length;
    $app.innerHTML = `<div class="view">
      <section class="result"><p>${esc(title)}</p>
        <div class="score">${ok.length}<small> / ${total}</small></div>
        <p>覚えた ${ok.length} 語・まだ ${ng.length} 語</p></section>
      <div class="actions">
        <button class="btn primary" id="rNg" ${ng.length ? "" : "disabled"}>「まだ」の ${ng.length} 語をもう一度</button>
        <button class="btn" id="rAll">最初からもう一度</button>
      </div>
      ${sec ? `<button class="btn" id="rQuiz">このセクションの四択クイズへ</button>` : ""}
      ${ng.length ? `<p class="section-label">まだの単語</p><div class="wlist">${ng.map(w => `<div class="wrow"><span class="n">${w.n}</span>
        <div class="w"><b>${esc(w.word)}</b><div class="m">${w.means.map((m, k) => (w.means.length > 1 ? CIRC[k] : "") + fmtMean(m)).join("　")}</div></div><span></span></div>`).join("")}</div>` : ""}
    </div>`;
    document.getElementById("rNg").onclick = () => go(() => cards(ng, title, sec), false);
    document.getElementById("rAll").onclick = () => go(() => cards(list, title, sec), false);
    if (sec) document.getElementById("rQuiz").onclick = () => go(() => quizSetup(sec));
  }
  document.getElementById("bFlip").onclick = flip;
  document.getElementById("bOk").onclick = () => commit(true);
  document.getElementById("bNg").onclick = () => commit(false);
  const onKey = e => {
    if (!document.getElementById("stage")) return keyOff();
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowLeft") flipped ? commit(true) : flip();
    else if (e.key === "ArrowRight") flipped ? commit(false) : flip();
  };
  const keyOff = () => { document.removeEventListener("keydown", onKey); if (window.__cardKey === onKey) window.__cardKey = null; };
  if (window.__cardKey) document.removeEventListener("keydown", window.__cardKey);
  window.__cardKey = onKey;
  document.addEventListener("keydown", onKey);
  render();
}

/* ---------- quiz ---------- */
function quizSetup(sec) {
  barTitle.textContent = sec ? `セクション ${sec.id}：クイズ` : "総合クイズ";
  const opts = { scope: sec ? "sec" : "all", mode: "mix", count: sec ? 0 : 20 };
  const scopes = sec ? [["sec", `このセクション（${sectionWords(sec).length}語）`], ["weak", "このセクションの苦手"]]
    : [["all", "全400語"], ...CATS.map(c => ["cat" + c.id, c.name]), ["weak", "苦手な単語"]];
  const pool = () => {
    const base = sec ? sectionWords(sec) : opts.scope.startsWith("cat") ? WORDS.filter(w => catOf(w.n).id === +opts.scope.slice(3)) : WORDS;
    return opts.scope === "weak" ? base.filter(w => status(w.n) === 0) : base;
  };
  const seg = (name, items) => `<div class="seg" data-name="${name}">${items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${String(opts[name]) === String(v)}">${l}</button>`).join("")}</div>`;
  $app.innerHTML = `<div class="view"><section class="setup">
    <div><h3>出題範囲</h3>${seg("scope", scopes)}</div>
    <div><h3>出題形式</h3>${seg("mode", [["mix", "ミックス"], ["w2m", "古語 → 意味"], ["m2w", "意味 → 古語"]])}</div>
    <div><h3>問題数</h3>${seg("count", [[10, "10問"], [20, "20問"], [0, "すべて"]])}</div>
    <p id="poolInfo" style="margin:0;font-size:13px;color:var(--muted)"></p>
    <button class="btn primary" id="startQuiz">スタート</button>
    <p style="margin:0;font-size:12px;color:var(--muted)">選択肢には、形の似た語・意味の紛らわしい語が優先して入ります。間違えた語は「まだ」として記録されます。</p>
  </section></div>`;
  const info = () => {
    const n = pool().length;
    document.getElementById("poolInfo").textContent = n ? `対象 ${n} 語から出題します。` : "この範囲に苦手な単語はありません。";
    document.getElementById("startQuiz").disabled = !n;
  };
  $app.querySelectorAll(".seg").forEach(s => s.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const name = s.dataset.name; opts[name] = name === "count" ? +b.dataset.v : b.dataset.v;
    s.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    info();
  }));
  info();
  document.getElementById("startQuiz").onclick = () => {
    let qs = shuffle(pool()); if (opts.count) qs = qs.slice(0, opts.count);
    go(() => quiz(qs, opts.mode, sec));
  };
}

function quiz(qs, mode, sec) {
  let i = 0, score = 0; const missed = [];
  function ask() {
    if (i >= qs.length) return result();
    const t = qs[i];
    const m = mode === "mix" ? (Math.random() < .5 ? "w2m" : "m2w") : mode;
    const opts = shuffle([t, ...distractors(t, m)]);
    $app.innerHTML = `<div class="view">
      <div class="deck-top"><div class="deck-stats"><span>${i + 1} / ${qs.length}</span><span class="ok">正解 ${score}</span></div>
      <div class="meter"><i style="width:${i / qs.length * 100}%;background:var(--ai)"></i></div></div>
      <section class="qcard" style="--cc:${catOf(t.n).color}">
        ${m === "w2m"
          ? `<span class="label">この古語の意味は？</span><div class="qword">${esc(t.word)}</div><span class="pos" style="justify-self:center">${esc(t.pos)}</span>`
          : `<span class="label">この意味をもつ古語は？</span><div class="qmean">${shortMean(t)}</div>`}
      </section>
      <div class="choices">${opts.map((o, k) => `<button class="choice" data-n="${o.n}"><span class="k">${"ABCD"[k]}</span>
        <span class="t ${m === "m2w" ? "word" : ""}">${m === "w2m" ? shortMean(o) : esc(o.word)}<span class="reveal" hidden>${
          m === "w2m" ? `<b>${esc(o.word)}</b>（No.${o.n}）` : shortMean(o)}</span></span></button>`).join("")}</div>
      <div class="feedback" id="fb"></div>
      <button class="btn primary" id="next" hidden>${i + 1 < qs.length ? "次の問題" : "結果を見る"}</button>
    </div>`;
    const btns = [...$app.querySelectorAll(".choice")];
    btns.forEach(b => b.onclick = () => {
      const right = +b.dataset.n === t.n;
      btns.forEach(x => { x.disabled = true; x.querySelector(".reveal").hidden = false; if (+x.dataset.n === t.n) x.classList.add("correct"); });
      const fb = document.getElementById("fb");
      if (right) { score++; fb.textContent = "正解！"; fb.className = "feedback ok"; }
      else { b.classList.add("wrong"); missed.push(t); mark(t.n, false); fb.textContent = `不正解　正解は「${t.word}」`; fb.className = "feedback ng"; }
      const nx = document.getElementById("next"); nx.hidden = false; nx.focus();
    });
    document.getElementById("next").onclick = () => { i++; ask(); window.scrollTo(0, 0); };
  }
  function result() {
    $app.innerHTML = `<div class="view">
      <section class="result"><p>${sec ? `セクション ${sec.id}` : "総合クイズ"}</p>
        <div class="score">${score}<small> / ${qs.length}</small></div>
        <p>正答率 ${Math.round(score / qs.length * 100)}%</p></section>
      <div class="actions">
        <button class="btn primary" id="qMiss" ${missed.length ? "" : "disabled"}>間違えた ${missed.length} 問を解き直す</button>
        <button class="btn" id="qCards" ${missed.length ? "" : "disabled"}>間違えた語をカードで</button>
      </div>
      <button class="btn" id="qHome">トップへ</button>
      ${missed.length ? `<p class="section-label">間違えた単語</p><div class="wlist">${missed.map(w => `<div class="wrow"><span class="n">${w.n}</span>
        <div class="w"><b>${esc(w.word)}</b><div class="m">${w.means.map((m, k) => (w.means.length > 1 ? CIRC[k] : "") + fmtMean(m)).join("　")}</div></div><span></span></div>`).join("")}</div>` : ""}
    </div>`;
    document.getElementById("qMiss").onclick = () => go(() => quiz(shuffle(missed), mode, sec), false);
    document.getElementById("qCards").onclick = () => go(() => cards(missed, "間違えた単語", sec));
    document.getElementById("qHome").onclick = goHome;
  }
  ask();
}

go(home, false);
</script>
